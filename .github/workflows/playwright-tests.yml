name: Playwright Tests

on: # when the workflow should get executed?
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main
  schedule:
    # 12:00 PM CST (18:00 UTC) every day.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04 # virtual machine to run the tests on (macOS, Windows, or Linux)
    timeout-minutes: 60 # maximum timeout in minutes for the entire workflow to be completed in

    env:
      PRACTICE_USERNAME: ${{ secrets.PRACTICE_USERNAME }}
      PRACTICE_PASSWORD: ${{ secrets.PRACTICE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run tests:headless

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn